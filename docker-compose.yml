# docker compose up -d
# docker compose down
version: '3.9'

services:
    db:
        image: postgres:16
        ports:
            - '5432:5432'
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: daisy_garden_dev
        volumes:
            - pgdata:/var/lib/postgresql/data

volumes:
    pgdata:
